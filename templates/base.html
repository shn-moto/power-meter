<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }}</title>
    <link rel="stylesheet" href="/static/app.css?v={{ static_asset_version }}">
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <span class="topbar-brand">HOME POWER METER</span>
            <nav class="topbar-nav">
                {% if request.url.path == '/' %}
                <a class="topbar-button" href="/connect-device">Подключить устройство</a>
                {% else %}
                <a class="topbar-link" href="/">На главный экран</a>
                {% endif %}
            </nav>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
